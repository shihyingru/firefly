# CI(文件 14 T5 / 文件 16):後端測試 + 卡片欄位驗證 + prompt injection 迴歸測試集(Wave 1.2 加入)
# CI (doc 14 T5 / doc 16): backend tests + card-field validation + prompt-injection regression suite (Wave 1.2)
name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: firefly_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/firefly_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DEVICE_TOKEN_PEPPER: ci-pepper
      LINE_ID_HMAC_KEY: ci-hmac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - run: python -m pytest -q
        working-directory: backend
