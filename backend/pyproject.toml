[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-backend"
version = "0.1.0"
description = "螢火 Firefly backend — AI clerk, human arbiters, bridging display / 開源媒體識讀基礎設施"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "redis>=5",
  "rq>=1.16",
  "httpx>=0.27",
  "numpy>=1.26",
  "jsonschema>=4.22",
  "pgvector>=0.3",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4", "ruff>=0.5"]
ml = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
include = ["firefly*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom / E501: bilingual comments run long
